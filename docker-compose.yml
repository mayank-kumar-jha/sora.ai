version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: super_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: super_ai
      POSTGRES_PASSWORD: super_ai_secret
      POSTGRES_DB: super_ai_assistant
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U super_ai -d super_ai_assistant']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: super_ai_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
